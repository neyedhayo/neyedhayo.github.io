<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Samuel Oyeneye - Research Portfolio</title>
    <meta name="description" content="A high-performance, minimalist research portfolio featuring efficient ML systems research, publications, and blog posts." />
    <meta property="og:title" content="Samuel Oyeneye - Research Portfolio" />
    <meta property="og:description" content="A high-performance, minimalist research portfolio featuring efficient ML systems research, publications, and blog posts." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/img/chiplogo.png" />
    <link rel="apple-touch-icon" href="/assets/img/chiplogo.png" />

    <!-- Google Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              palatino: ['"Palatino Linotype"', '"Book Antiqua"', 'Palatino', '"URW Palladio L"', 'Georgia', 'serif'],
              serif: ['"Palatino Linotype"', '"Book Antiqua"', 'Palatino', '"URW Palladio L"', 'Georgia', 'serif'],
              sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              accent: {
                DEFAULT: '#7FEE64',
                dark: '#1b7428',
                hover: '#68df4f',
              }
            }
          }
        }
      }
    </script>
    
    <!-- MathJax for LaTeX support -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']]
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

    <!-- PrismJS for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #525252;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #737373;
      }

      .glass {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background-color: rgba(255, 255, 255, 0.8);
      }
      .dark .glass {
        background-color: rgba(5, 5, 5, 0.8);
      }
      
      ::selection {
        background-color: #7FEE64;
        color: #000000;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#fffdfa] text-[#1f1f1f] antialiased selection:bg-[#7FEE64] selection:text-black">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
